<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Second-Hand Equipment Directory - Sales Tool</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --teal: #01818E;
  --teal-light: #14C6D4;
  --teal-dark: #015159;
  --teal-tint: #E6F4F5;
  --ink: #1B2733;
  --ink-dim: #5B6B78;
  --ink-faint: #8B98A5;
  --bg: #F5F7F8;
  --bg-elev: #FFFFFF;
  --card: #FFFFFF;
  --border: #E0E5E9;
  --border-strong: #C7CED4;
  --radius-lg: 10px;
  --radius-md: 8px;
  --radius-sm: 6px;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.asc-display { font-family: 'Inter', sans-serif; }
.asc-mono { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }

#asc-root { position: relative; z-index: 1; width: 100%; padding: 28px 32px 70px; max-width: 1440px; margin: 0 auto; }

/* ---- Card base (simple, flat, professional) ---- */
.glass {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 1px 3px rgba(16,24,32,0.06);
  position: relative;
}

/* ---- Header ---- */
.asc-header { padding: 22px 26px; margin-bottom: 20px; }
.asc-header-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.asc-brand { display: flex; align-items: center; gap: 14px; }
.asc-mark {
  width: 50px; height: 50px; border-radius: var(--radius-md); flex-shrink: 0;
  background: var(--teal);
  display: flex; align-items: center; justify-content: center;
}
.asc-mark svg { width: 26px; height: 26px; }
.asc-wordmark { display: flex; flex-direction: column; gap: 2px; }
.asc-wordmark-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0; }
.asc-wordmark-title span { color: var(--teal); }
.asc-wordmark-sub { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }

.asc-hero { margin-top: 20px; }
.asc-hero-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(24px, 3.4vw, 34px); margin: 0 0 8px; letter-spacing: -0.01em; }
.asc-hero-title .accent {
  color: var(--teal);
}
.asc-hero-sub { color: var(--ink-dim); font-size: 15px; max-width: 640px; line-height: 1.5; margin: 0; }
.asc-tagline { color: var(--ink-faint); font-size: 12.5px; margin-top: 10px; font-style: normal; }

/* ---- Controls ---- */
.asc-controls { display: flex; gap: 10px; align-items: center; margin-top: 24px; flex-wrap: wrap; }
.asc-search { position: relative; flex: 1 1 240px; min-width: 200px; }
.asc-search input {
  width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; padding: 11px 16px 11px 40px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: #FFFFFF;
  color: var(--ink); outline: none; transition: border-color .15s;
}
.asc-search input::placeholder { color: var(--ink-faint); }
.asc-search input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-tint); }
.asc-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none; }

.asc-select {
  font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; padding: 10px 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: #FFFFFF;
  color: var(--ink); outline: none; cursor: pointer; transition: border-color .15s;
}
.asc-select:focus { border-color: var(--teal); }
select option { background: #fff; color: var(--ink); }

.asc-chips { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.asc-chip {
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 7px 15px; border-radius: 20px;
  border: 1px solid var(--border); background: #FFFFFF; color: var(--ink-dim);
  cursor: pointer; transition: all .15s; letter-spacing: 0;
}
.asc-chip:hover { border-color: var(--border-strong); color: var(--ink); }
.asc-chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }

/* ---- Stats ---- */
.asc-stats { display: flex; gap: 12px; margin: 22px 0; flex-wrap: wrap; }
.asc-stat { padding: 12px 20px; display: flex; align-items: baseline; gap: 9px; border-radius: var(--radius-md); }
.asc-stat-num { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; }
.asc-stat-label { font-size: 11px; color: var(--ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.asc-stat-total .asc-stat-num { color: var(--teal); }
.asc-stat-sweeper .asc-stat-num { color: var(--ink); }
.asc-stat-scrubber .asc-stat-num { color: var(--teal-dark); }

/* ---- Model counts ---- */
.asc-model-counts { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 22px; }
.asc-count-chip {
  display: flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 20px;
  background: #FFFFFF; border: 1px solid var(--border); font-family: 'Inter', sans-serif;
}
.asc-count-name { font-size: 12.5px; font-weight: 600; color: var(--ink-dim); }
.asc-count-num { font-size: 12.5px; font-weight: 700; color: var(--teal-dark); }

/* ---- Grid ---- */
.asc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

.asc-card { border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.asc-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(16,24,32,0.12); border-color: var(--border-strong); }

.asc-card-img-wrap { aspect-ratio: 4/3; background: #EDF0F2; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.asc-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.asc-card-img-wrap::after {
  content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.45) 100%); pointer-events: none;
}
.asc-card-noimg { color: var(--ink-faint); display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; }

.asc-badge {
  position: absolute; top: 10px; left: 10px; z-index: 3; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em; padding: 5px 11px; border-radius: 20px; color: #fff;
}
.asc-badge.sweeper { background: var(--teal-light); }
.asc-badge.scrubber { background: var(--teal-dark); }

.asc-price-tag {
  position: absolute; top: 10px; right: 10px; z-index: 3; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px;
  padding: 6px 12px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.95);
  border: 1px solid rgba(0,0,0,0.08); color: var(--teal-dark);
}
.asc-photo-count {
  position: absolute; bottom: 10px; left: 10px; z-index: 3; background: rgba(0,0,0,0.55);
  color: #fff; font-size: 10.5px; font-weight: 600; padding: 5px 10px; border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 5px;
}

.asc-card-body { padding: 16px 18px 18px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); }
.asc-card-name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 6px; color: var(--ink); }
.asc-card-specs { display: flex; flex-wrap: wrap; gap: 6px 10px; font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--ink-dim); }
.asc-card-specs span { display: flex; align-items: center; gap: 4px; }
.asc-card-specs span:not(:last-child)::after { content: '·'; margin-left: 8px; color: var(--ink-faint); }
.asc-card-notes { margin-top: 0; font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---- Empty / loading / error ---- */
.asc-state-msg { grid-column: 1/-1; text-align: center; padding: 70px 20px; color: var(--ink-dim); }
.asc-state-msg .asc-mono { color: var(--ink-faint); font-size: 12.5px; margin-top: 10px; display: block; }
.asc-retry-btn {
  margin-top: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; padding: 10px 20px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: #FFFFFF; color: var(--ink);
  cursor: pointer; transition: border-color .15s;
}
.asc-retry-btn:hover { border-color: var(--teal); color: var(--teal); }

/* ---- Lightbox ---- */
.asc-lightbox {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
  background: rgba(20,26,32,0.72); padding: 20px;
}
.asc-lightbox.open { display: flex; }
.asc-lightbox-panel {
  width: 100%; max-width: 1240px; max-height: 90vh; border-radius: var(--radius-lg); overflow: hidden;
  display: grid; grid-template-columns: 1.5fr 1fr; position: relative; background: #fff;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

/* left: photos */
.asc-lightbox-media { display: flex; flex-direction: column; height: 100%; min-height: 0; background: #12161a; overflow: hidden; }
.asc-lightbox-main { position: relative; flex: 1; min-height: 0; max-height: 65vh; background: #12161a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.asc-lightbox-main img { max-width: 100%; max-height: 65vh; width: auto; height: auto; object-fit: contain; display: block; margin: auto; }
.asc-lightbox-thumbs { flex-shrink: 0; display: flex; gap: 8px; padding: 14px 16px; overflow-x: auto; background: #1B2127; border-top: 1px solid rgba(255,255,255,0.08); }
.asc-lightbox-thumb { width: 60px; height: 60px; border-radius: var(--radius-sm); object-fit: cover; cursor: pointer; opacity: 0.55; border: 2px solid transparent; flex-shrink: 0; transition: opacity .15s, border-color .15s; }
.asc-lightbox-thumb.active { opacity: 1; border-color: var(--teal-light); }
.asc-lightbox-thumb:hover { opacity: 0.85; }

.asc-download-btn {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 0 16px 14px; padding: 10px 18px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.08); color: #fff; font-family: 'Inter', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s;
}
.asc-download-btn:hover:not(:disabled) { background: var(--teal); border-color: var(--teal); }
.asc-download-btn:disabled { opacity: 0.5; cursor: default; }
.asc-download-btn.hidden { display: none; }

.asc-close-btn {
  position: absolute; top: 16px; right: 16px; z-index: 10; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.2); color: #fff;
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s;
}
.asc-close-btn:hover { background: var(--teal-dark); }

.asc-nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.2); color: #fff;
  display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; transition: background .15s;
}
.asc-nav-btn:hover { background: var(--teal); }
.asc-nav-btn.prev { left: 14px; }
.asc-nav-btn.next { right: 14px; }

/* right: details */
.asc-lightbox-details { display: flex; flex-direction: column; height: 100%; min-height: 0; background: #FFFFFF; border-left: 1px solid var(--border); overflow: hidden; }
.asc-lightbox-details-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 36px 32px 24px; display: flex; flex-direction: column; gap: 24px; }
.asc-lightbox-details-top { display: flex; flex-direction: column; gap: 12px; padding-right: 40px; }
.asc-lightbox-category {
  align-self: flex-start; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border); color: var(--ink-dim);
}
.asc-lightbox-category.sweeper { background: var(--teal-tint); color: var(--teal-dark); border-color: rgba(1,129,142,0.25); }
.asc-lightbox-category.scrubber { background: #EAF6F7; color: var(--teal-dark); border-color: rgba(1,129,142,0.3); }
.asc-lightbox-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; margin: 0; line-height: 1.25; color: var(--ink); }

.asc-lightbox-spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
.asc-lightbox-spec-item { display: flex; flex-direction: column; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.asc-lightbox-spec-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); }
.asc-lightbox-spec-value { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--ink); }

.asc-lightbox-notes { display: none; flex-direction: column; gap: 8px; }
.asc-lightbox-notes-text { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-dim); white-space: pre-line; }

.asc-lightbox-price-box {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px 32px; border-top: 1px solid var(--border); background: #F7F9FA;
}
.asc-lightbox-price-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); }
.asc-lightbox-price { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 26px; color: var(--teal-dark); }

/* ---- Footer ---- */
.asc-footer { text-align: center; padding: 40px 10px 10px; color: var(--ink-faint); font-size: 12px; }
.asc-footer strong { color: var(--ink-dim); }

/* ---- Scrollbar ---- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

/* ---- Responsive ---- */
@media (max-width: 900px) {
  .asc-lightbox-panel { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 42vh) 1fr; max-height: 94vh; }
  .asc-lightbox-details { border-left: none; border-top: 1px solid var(--border); }
  .asc-lightbox-details-scroll { padding: 26px 22px 16px; gap: 20px; }
  .asc-lightbox-details-top { padding-right: 0; }
  .asc-lightbox-title { font-size: 20px; }
  .asc-lightbox-price-box { padding: 16px 22px; }
  .asc-lightbox-price { font-size: 21px; }
}

@media (max-width: 720px) {
  #asc-root { padding: 16px 14px 50px; }
  .asc-header { padding: 18px 16px; }
  .asc-wordmark-title { font-size: 15px; }
  .asc-mark { width: 42px; height: 42px; border-radius: var(--radius-sm); }
  .asc-mark svg { width: 22px; height: 22px; }
  .asc-hero-title { font-size: 22px; }
  .asc-hero-sub { font-size: 13.5px; }
  .asc-controls { margin-top: 18px; }
  .asc-select { flex: 1 1 auto; }
  .asc-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .asc-card-name { font-size: 15px; }
  .asc-card-body { padding: 12px 14px 14px; }
  .asc-nav-btn { width: 40px; height: 40px; }
  .asc-lightbox-spec-grid { grid-template-columns: 1fr; gap: 12px; }
}
</style>
</head>
<body>

<div id="asc-root">

  <header class="asc-header glass">
    <div class="asc-header-top">
      <div class="asc-brand">
        <div class="asc-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20L14 4M14 4L11 4M14 4L14 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 20H20" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="18" cy="9" r="2.3" stroke="#fff" stroke-width="1.6"/>
          </svg>
        </div>
        <div class="asc-wordmark">
          <div class="asc-wordmark-title">Australian <span>Sweeper</span> Company.</div>
          <div class="asc-wordmark-sub">Sweepers &amp; Scrubbers</div>
        </div>
      </div>
    </div>

    <div class="asc-hero">
      <h1 class="asc-hero-title">Second-Hand <span class="accent">Machine Directory</span></h1>
      <p class="asc-hero-sub">Browse current stock levels. Sales use ONLY.</p>
    </div>

    <div class="asc-controls">
      <div class="asc-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#A7AFBA" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="#A7AFBA" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="asc-search-input" type="text" placeholder="Search by model, serial, location…">
      </div>
      <select id="asc-state-select" class="asc-select"><option value="All">All Locations</option></select>
      <select id="asc-sort-select" class="asc-select">
        <option value="newest">Newest First</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="hours-asc">Hours: Low to High</option>
      </select>
    </div>

    <div class="asc-chips" id="asc-chips"></div>
  </header>

  <div class="asc-stats" id="asc-stats"></div>
  <div class="asc-model-counts" id="asc-model-counts"></div>

  <main class="asc-grid" id="asc-grid">
    <div class="asc-state-msg">
      <span class="asc-display" style="font-size:16px;">Loading equipment…</span>
    </div>
  </main>

  <footer class="asc-footer">
    <strong>Australian Sweeper Company.</strong> — Second-Hand Equipment Directory
  </footer>
</div>

<div class="asc-lightbox" id="asc-lightbox">
  <div class="asc-lightbox-panel glass">
    <button class="asc-close-btn" id="asc-close-btn" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="asc-lightbox-media">
      <div class="asc-lightbox-main">
        <button class="asc-nav-btn prev" id="asc-prev-btn" aria-label="Previous photo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <img id="asc-lightbox-img" src="" alt="" decoding="async">
        <button class="asc-nav-btn next" id="asc-next-btn" aria-label="Next photo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="asc-lightbox-thumbs" id="asc-lightbox-thumbs"></div>
      <button class="asc-download-btn" id="asc-download-btn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3V15M12 15L7 10M12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="asc-download-btn-label">Download Photos</span>
      </button>
    </div>

    <div class="asc-lightbox-details">
      <div class="asc-lightbox-details-scroll">
        <div class="asc-lightbox-details-top">
          <span class="asc-lightbox-category" id="asc-lightbox-category"></span>
          <h3 class="asc-lightbox-title" id="asc-lightbox-name"></h3>
        </div>
        <div class="asc-lightbox-spec-grid" id="asc-lightbox-specs"></div>
        <div class="asc-lightbox-notes" id="asc-lightbox-notes">
          <span class="asc-lightbox-spec-label">Notes</span>
          <p class="asc-lightbox-notes-text" id="asc-lightbox-notes-text"></p>
        </div>
      </div>
      <div class="asc-lightbox-price-box">
        <span class="asc-lightbox-price-label">Price</span>
        <span class="asc-lightbox-price" id="asc-lightbox-price"></span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const DATA_URL = 'data/machines.json';
  let MACHINES = [];
  let state = { search: '', category: 'All', location: 'All', sort: 'newest' };
  let lightbox = { machine: null, photoIndex: 0 };

  const grid = document.getElementById('asc-grid');
  const chipsEl = document.getElementById('asc-chips');
  const statsEl = document.getElementById('asc-stats');
  const modelCountsEl = document.getElementById('asc-model-counts');
  const searchInput = document.getElementById('asc-search-input');
  const stateSelect = document.getElementById('asc-state-select');
  const sortSelect = document.getElementById('asc-sort-select');

  const CATS = ['Sweeper', 'Scrubber'];

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatPrice(price) {
    const cleaned = String(price || '').replace(/,/g, '').trim();
    const n = Number(cleaned);
    if (!cleaned || isNaN(n)) return 'POA';
    return '$' + n.toLocaleString('en-AU');
  }

  function formatHours(hours) {
    if (!hours || hours === '' || isNaN(parseFloat(hours))) return null;
    return parseFloat(hours).toLocaleString('en-AU') + ' hrs';
  }

  async function loadData() {
    try {
      const res = await fetch(DATA_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      MACHINES = json.machines || [];
      populateStateOptions();
      renderChips();
      renderAll();
      renderModelCounts();
    } catch (err) {
      grid.innerHTML = `<div class="asc-state-msg">
        <div class="asc-display" style="font-size:16px;">Couldn't load the equipment database</div>
        <span class="asc-mono">${escapeHtml(err.message)}</span>
        <span class="asc-mono">If you opened this file directly (file://), browsers block local JSON requests.<br>Serve this folder instead, e.g.: <strong>python3 -m http.server</strong>, then open the printed localhost URL.</span>
        <button class="asc-retry-btn" onclick="location.reload()">Retry</button>
      </div>`;
    }
  }

  function populateStateOptions() {
    const states = [...new Set(MACHINES.map(m => m.state).filter(Boolean))].sort();
    stateSelect.innerHTML = '<option value="All">All Locations</option>' +
      states.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  }

  function renderChips() {
    const cats = ['All', ...CATS];
    chipsEl.innerHTML = cats.map(c =>
      `<button class="asc-chip ${state.category === c ? 'active' : ''}" data-cat="${c}">${c}${c !== 'All' ? 's' : ''}</button>`
    ).join('');
    chipsEl.querySelectorAll('.asc-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        state.category = btn.dataset.cat;
        renderChips();
        renderAll();
      });
    });
  }

  function getFiltered() {
    let list = MACHINES.filter(m => {
      if (state.category !== 'All' && m.category !== state.category) return false;
      if (state.location !== 'All' && m.state !== state.location) return false;
      if (state.search) {
        const q = state.search.toLowerCase();
        const hay = [m.name, m.serial, m.state, m.powerType].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    list.sort((a, b) => {
      if (state.sort === 'price-asc') return (Number(String(a.price||'').replace(/,/g,'')) || Infinity) - (Number(String(b.price||'').replace(/,/g,'')) || Infinity);
      if (state.sort === 'price-desc') return (Number(String(b.price||'').replace(/,/g,'')) || -Infinity) - (Number(String(a.price||'').replace(/,/g,'')) || -Infinity);
      if (state.sort === 'hours-asc') return (Number(a.hours) || Infinity) - (Number(b.hours) || Infinity);
      return new Date(b.dateAdded || 0) - new Date(a.dateAdded || 0);
    });
    return list;
  }

  /* Grab just the model key from the name (e.g. "M6 LPG" out of
     "M6 LPG Ride-On Sweeper"), ignoring pure numbers/serials so that
     variants like "M3 EB 1201", "M3 1201 EB" and "M3 1150 EB" all
     collapse into the same "M3 EB" group instead of splitting apart. */
  function getModelKey(m) {
    const name = String((m && m.name) || '').trim();
    if (!name) return 'Unnamed';
    const words = name.split(/\s+/).filter(w => !/^\d+$/.test(w));
    const source = words.length ? words : name.split(/\s+/);
    return source.slice(0, 2).join(' ');
  }

  /* Fixed display order: match on the model code CONTAINED in the key
     (not an exact/whole-string match), in this priority order. Anything
     that doesn't contain one of these codes falls into "the rest". */
  const MODEL_ORDER = ['M8', 'M6', 'M5', 'M3', 'M2', 'M1', 'ME', 'E110', 'E85', 'E83', 'E81', 'E71', 'E61', 'E51', 'TR'];

  function getModelPriority(key) {
    for (let i = 0; i < MODEL_ORDER.length; i++) {
      if (key.includes(MODEL_ORDER[i])) return i;
    }
    return MODEL_ORDER.length; // "the rest"
  }

  function renderModelCounts() {
    const counts = {};
    MACHINES.forEach(m => {
      const key = getModelKey(m);
      counts[key] = (counts[key] || 0) + 1;
    });
    const keys = Object.keys(counts).sort((a, b) => {
      const pa = getModelPriority(a);
      const pb = getModelPriority(b);
      if (pa !== pb) return pa - pb;
      return a.localeCompare(b); // alphabetical within the same priority group
    });
    modelCountsEl.innerHTML = keys.map(k =>
      `<div class="asc-count-chip"><span class="asc-count-name">${escapeHtml(k)}</span><span class="asc-count-num asc-mono">×${counts[k]}</span></div>`
    ).join('');
  }

  function renderStats() {
    const total = MACHINES.length;
    const sweepers = MACHINES.filter(m => m.category === 'Sweeper').length;
    const scrubbers = MACHINES.filter(m => m.category === 'Scrubber').length;
    statsEl.innerHTML = `
      <div class="asc-stat glass asc-stat-total"><span class="asc-stat-num asc-mono">${total}</span><span class="asc-stat-label">Total Stock</span></div>
      <div class="asc-stat glass asc-stat-sweeper"><span class="asc-stat-num asc-mono">${sweepers}</span><span class="asc-stat-label">Sweepers</span></div>
      <div class="asc-stat glass asc-stat-scrubber"><span class="asc-stat-num asc-mono">${scrubbers}</span><span class="asc-stat-label">Scrubbers</span></div>
    `;
  }

  function cardTemplate(m, idx) {
    const img = (m.images && m.images[0]) || null;
    const specs = [m.state, m.serial ? `S/N ${m.serial}` : null, formatHours(m.hours), m.powerType && m.powerType !== 'Not specified' ? m.powerType : null].filter(Boolean);
    return `
      <div class="asc-card glass" data-idx="${idx}">
        <div class="asc-card-img-wrap">
          ${m.category ? `<div class="asc-badge ${m.category.toLowerCase()}">${escapeHtml(m.category)}</div>` : ''}
          <div class="asc-price-tag">${formatPrice(m.price)}</div>
          ${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(m.name)}" width="400" height="300" loading="lazy" decoding="async">` : `<div class="asc-card-noimg">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#6E7681" stroke-width="1.6"/><circle cx="9" cy="10" r="1.6" stroke="#6E7681" stroke-width="1.4"/><path d="M21 16L15 11L5 19" stroke="#6E7681" stroke-width="1.6"/></svg>
              No photos yet</div>`}
          ${m.images && m.images.length ? `<div class="asc-photo-count">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#fff" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6" stroke="#fff" stroke-width="1.4"/></svg>
              ${m.images.length}</div>` : ''}
        </div>
        <div class="asc-card-body">
          <h3 class="asc-card-name">${escapeHtml(m.name || 'Unnamed Unit')}</h3>
          <div class="asc-card-specs asc-mono">${specs.map(s => `<span>${escapeHtml(s)}</span>`).join('')}</div>
          ${m.notes ? `<p class="asc-card-notes">${escapeHtml(m.notes)}</p>` : ''}
        </div>
      </div>
    `;
  }

  function renderAll() {
    renderStats();
    const list = getFiltered();
    if (!list.length) {
      grid.innerHTML = `<div class="asc-state-msg">
        <div class="asc-display" style="font-size:16px;">No machines match your filters</div>
        <span class="asc-mono">Try clearing the search or selecting a different category.</span>
      </div>`;
      return;
    }
    grid.innerHTML = list.map((m, i) => cardTemplate(m, i)).join('');
    grid.__list = list;
    grid.querySelectorAll('.asc-card').forEach(card => {
      card.addEventListener('click', () => openLightbox(grid.__list[Number(card.dataset.idx)]));
    });
  }

  searchInput.addEventListener('input', () => { state.search = searchInput.value.trim(); renderAll(); });
  stateSelect.addEventListener('change', () => { state.location = stateSelect.value; renderAll(); });
  sortSelect.addEventListener('change', () => { state.sort = sortSelect.value; renderAll(); });

  /* ---- Lightbox ---- */
  const lbEl = document.getElementById('asc-lightbox');
  const lbImg = document.getElementById('asc-lightbox-img');
  const lbThumbs = document.getElementById('asc-lightbox-thumbs');
  const lbName = document.getElementById('asc-lightbox-name');
  const lbCategory = document.getElementById('asc-lightbox-category');
  const lbSpecs = document.getElementById('asc-lightbox-specs');
  const lbPrice = document.getElementById('asc-lightbox-price');
  const lbNotes = document.getElementById('asc-lightbox-notes');
  const lbNotesText = document.getElementById('asc-lightbox-notes-text');
  const lbDownloadBtn = document.getElementById('asc-download-btn');
  const lbDownloadLabel = document.getElementById('asc-download-btn-label');

  function slugify(str) {
    return String(str || 'machine').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'machine';
  }

  let jsZipLoadPromise = null;
  function loadJSZip() {
    if (window.JSZip) return Promise.resolve();
    if (jsZipLoadPromise) return jsZipLoadPromise;
    jsZipLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      script.onload = resolve;
      script.onerror = () => reject(new Error('Failed to load ZIP library'));
      document.head.appendChild(script);
    });
    return jsZipLoadPromise;
  }

  async function downloadPhotos() {
    const m = lightbox.machine;
    const images = (m && m.images) || [];
    if (!images.length || lbDownloadBtn.disabled) return;
    lbDownloadBtn.disabled = true;
    lbDownloadLabel.textContent = 'Preparing…';
    try {
      await loadJSZip();
      const zip = new JSZip();
      const base = slugify(m.name) + (m.serial ? '-' + slugify(m.serial) : '');
      await Promise.all(images.map(async (path, i) => {
        const filename = path.split('/').pop();
        const proxyUrl = 'https://asc-image-proxy.nickb-338.workers.dev/' + filename;
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const ext = (path.split('.').pop() || 'jpg').split(/[?#]/)[0];
        zip.file(`${base}-${i + 1}.${ext}`, blob);
      }));
      const content = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${base}-photos.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (err) {
      alert("Couldn't download photos: " + err.message);
    } finally {
      lbDownloadBtn.disabled = false;
      lbDownloadLabel.textContent = `Download Photos (${images.length})`;
    }
  }

  lbDownloadBtn.addEventListener('click', downloadPhotos);

  function specItem(label, value) {
    return `<div class="asc-lightbox-spec-item"><span class="asc-lightbox-spec-label">${escapeHtml(label)}</span><span class="asc-lightbox-spec-value">${escapeHtml(value)}</span></div>`;
  }

  function openLightbox(machine) {
    lightbox.machine = machine;
    lightbox.photoIndex = 0;
    renderLightbox();
    lbEl.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lbEl.classList.remove('open');
    document.body.style.overflow = '';
  }

  function renderLightbox() {
    const m = lightbox.machine;
    if (!m) return;
    const images = m.images && m.images.length ? m.images : [];
    const src = images[lightbox.photoIndex] || '';
    lbImg.src = src;
    lbImg.alt = m.name || '';
    lbName.textContent = m.name || 'Unnamed Unit';

    if (m.category) {
      lbCategory.textContent = m.category;
      lbCategory.className = 'asc-lightbox-category ' + m.category.toLowerCase();
      lbCategory.style.display = 'inline-flex';
    } else {
      lbCategory.style.display = 'none';
    }

    const specs = [];
    if (m.state) specs.push(specItem('Location', m.state));
    if (m.serial) specs.push(specItem('Serial No.', m.serial));
    const hrs = formatHours(m.hours);
    if (hrs) specs.push(specItem('Hours', hrs));
    if (m.powerType && m.powerType !== 'Not specified') specs.push(specItem('Power', m.powerType));
    lbSpecs.innerHTML = specs.join('') || `<div class="asc-lightbox-spec-item"><span class="asc-lightbox-spec-value" style="color:var(--ink-faint)">No additional details available</span></div>`;

    if (m.notes && m.notes.trim()) {
      lbNotesText.textContent = m.notes.trim();
      lbNotes.style.display = 'flex';
    } else {
      lbNotes.style.display = 'none';
    }

    lbPrice.textContent = formatPrice(m.price);

    lbDownloadBtn.classList.toggle('hidden', images.length === 0);
    lbDownloadLabel.textContent = images.length ? `Download Photos (${images.length})` : 'Download Photos';

    lbThumbs.style.display = images.length > 1 ? 'flex' : 'none';
    lbThumbs.innerHTML = images.map((img, i) =>
      `<img class="asc-lightbox-thumb ${i === lightbox.photoIndex ? 'active' : ''}" src="${escapeHtml(img)}" data-i="${i}" width="60" height="60" loading="lazy" decoding="async">`
    ).join('');
    lbThumbs.querySelectorAll('.asc-lightbox-thumb').forEach(t => {
      t.addEventListener('click', () => { lightbox.photoIndex = Number(t.dataset.i); renderLightbox(); });
    });
  }

  function step(dir) {
    const m = lightbox.machine;
    if (!m || !m.images || !m.images.length) return;
    lightbox.photoIndex = (lightbox.photoIndex + dir + m.images.length) % m.images.length;
    renderLightbox();
  }

  document.getElementById('asc-close-btn').addEventListener('click', closeLightbox);
  document.getElementById('asc-prev-btn').addEventListener('click', () => step(-1));
  document.getElementById('asc-next-btn').addEventListener('click', () => step(1));
  lbEl.addEventListener('click', e => { if (e.target === lbEl) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lbEl.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  let touchStartX = null;
  lbEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  lbEl.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) step(dx > 0 ? -1 : 1);
    touchStartX = null;
  }, { passive: true });

  loadData();
})();
</script>
</body>
</html>
